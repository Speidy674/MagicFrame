<h1 class="mt-4">Files</h1>
<ol class="breadcrumb mb-4">
    <li class="breadcrumb-item active">Files</li>
</ol>

<div class="row">
    <div class="col">
        <div class="card">
            <div class="card-header">
                Files
            </div>
            <div class="card-body">
                Files Amount: <span id="fileCount">0</span>
            </div>
        </div>
    </div>
    <div class="col">
        <div class="card">
            <div class="card-header">
                Files Page <span id="filesCurrentPage">x</span> / <span id="filesTotalPage">x</span>
            </div>
            <div class="card-body">
                <button type="button" onclick="loadFiles()" class="btn btn-primary">
                    Neuladen
                </button>
                <button type="button" onclick="prevFilesPage()" class="btn btn-primary">
                    Prev
                </button>
                <button type="button" onclick="nextFilesPage()" class="btn btn-primary">
                    Next
                </button>
            </div>
        </div>
    </div>
</div>


<div class="row row-cols-sm-1 row-cols-md-4 g-2 p-2" id="filesContainer">
</div>

{{={{{ }}}=}}
<template id="fileItem">
    <div class="col-sm-2 col-md-3">
        <div class="card bg-dark" style=" height: 250px; ">
            {{#isVid}}
                <video src="{{src}}" class="card-img" style="aspect-ratio: 16/9;object-fit: cover;height: 100%;"
                    autoplay muted></video>
            {{/isVid}}
            {{^isVid}}
                <img src="{{src}}" class="card-img" style="aspect-ratio: 16/9;object-fit: cover;height: 100%;"></img>
            {{/isVid}}

            <div class="card-img-overlay text-white" style="backdrop-filter: blur(5px); background-color: #0000004d;">
                <div class="card-header d-flex justify-content-between">
                    <h5 class="pe-3">File</h5>
                    <h5 class="text-truncate">{{id}}</h5>
                </div>
                <div class="card-body">
                    <div>
                        <p class="text-truncate">File: {{fileName}}</p>
                        <p class="text-truncate">Type: {{fileType}}</p>
                        <p class="text-truncate">Folder: {{fileFolder}}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
{{{={{ }}=}}}


<script src="/dashboard/js/files.js" defer></script>
