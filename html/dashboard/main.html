<!DOCTYPE html>
<html data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <title>MagicFrame - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link href="/dashboard/css/styles.css" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js "></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
    integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
    crossorigin="anonymous"></script>
  <script src="/mustache.min.js" defer></script>
  <script src="/dashboard/js/scripts.js" defer></script>

</head>

<body class="sb-nav-fixed">
  <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
    <!-- Navbar Brand-->
    <a class="navbar-brand ps-3" href="/dashboard">Magic Frame</a>
    <!-- Sidebar Toggle-->
    <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!">
      <i class="bi bi-list"></i>
    </button>
    <!-- Navbar-->
  </nav>
  <div id="layoutSidenav">
    <div id="layoutSidenav_nav">
      <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
        <div class="sb-sidenav-menu">
          <div class="nav">
            <div class="sb-sidenav-menu-heading">Core</div>
            <a class="nav-link" href="/dashboard">
              <div class="sb-nav-link-icon"><i class="bi bi-gear"></i></div>
              Dashboard
            </a>
            <a class="nav-link" href="/dashboard/files">
              <div class="sb-nav-link-icon"><i class="bi bi-file-earmark"></i></div>
              Files
            </a>
            <a class="nav-link" href="/dashboard/frames">
              <div class="sb-nav-link-icon"><i class="bi bi-image"></i></div>
              Frames
            </a>
            <div class="sb-sidenav-menu-heading">Settings</div>
            <a class="nav-link" href="/dashboard/settings/global">
              <div class="sb-nav-link-icon"><i class="bi bi-gear"></i></div>
              Global
            </a>
            <a class="nav-link" href="/dashboard/settings/frames">
              <div class="sb-nav-link-icon"><i class="bi bi-image"></i></div>
              Frames
            </a>
          </div>
        </div>
        <div class="sb-sidenav-footer">
          <div class="small">Version</div>
          {{version}}
        </div>
      </nav>
    </div>
    <div id="layoutSidenav_content">
      <main>
        <div class="container-fluid px-4">
          {{{mainContent}}}
        </div>
      </main>
      <footer class="py-4 bg-light mt-auto">
        <div class="container-fluid px-4">
          <div class="d-flex align-items-center justify-content-between small">
            <div class="text-muted">Copyright &copy; Magic Frame {{copyrightYear}}</div>
          </div>
        </div>
      </footer>
    </div>
  </div>
</body>

</html>
